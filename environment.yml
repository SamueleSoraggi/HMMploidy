name: hmmploidy
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.23
  - scipy>=1.9
  - pandas>=1.5
  - matplotlib>=3.6
  - numba>=0.57
  - samtools>=1.10   # only needed for BAM input
  - pymc>=5.10
  - arviz>=0.15
  - jupyterlab
  - ipykernel
  - pytest
  - pip
  - pip:
      - -e .
